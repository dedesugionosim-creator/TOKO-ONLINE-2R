<script>
    // ===== BLOK 5.1.1 - Fungsi Data & Hash =====
    function getDataAkun() {
        var dataAkun = localStorage.getItem('2r_akun');
        if (dataAkun) {
            return JSON.parse(dataAkun);
        }
        return [];
    }

    function simpanDataAkun(akun) {
        localStorage.setItem('2r_akun', JSON.stringify(akun));
    }

    async function hashPassword(password) {
        var encoder = new TextEncoder();
        var data = encoder.encode(password);
        var hashBuffer = await crypto.subtle.digest('SHA-256', data);
        var hashArray = Array.from(new Uint8Array(hashBuffer));
        var hashString = hashArray.map(function(b) {
            return b.toString(16).padStart(2, '0');
        }).join('');
        return hashString;
    }

    function generateId(role) {
        var dataAkun = getDataAkun();
        var daftarAkun = dataAkun.filter(function(akun) {
            return akun.role === role;
        });
        var nomorUrut = 1;
        for (var indeks = 0; indeks < daftarAkun.length; indeks++) {
            var akun = daftarAkun[indeks];
            var pecahanId = akun.id.split('-');
            if (pecahanId.length === 2) {
                var angkaId = parseInt(pecahanId[1]);
                if (angkaId >= nomorUrut) {
                    nomorUrut = angkaId + 1;
                }
            }
        }
        var prefix = '';
        if (role === 'customer') prefix = 'CUST';
        else if (role === 'toko') prefix = 'TOKO';
        else if (role === 'ojek') prefix = 'OJEK';
        else if (role === 'pedagang') prefix = 'PEDAGANG';
        else if (role === 'codseller') prefix = 'COD';
        else prefix = 'USR';
        return prefix + '-' + String(nomorUrut).padStart(3, '0');
    }

    function tampilkanToast(pesan, tipe) {
        if (!tipe) {
            tipe = 'success';
        }
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'toast ' + tipe;
        var ikon = '';
        if (tipe === 'success') {
            ikon = 'fa-check-circle';
        } else if (tipe === 'error') {
            ikon = 'fa-times-circle';
        } else if (tipe === 'warning') {
            ikon = 'fa-exclamation-triangle';
        } else {
            ikon = 'fa-info-circle';
        }
        toast.innerHTML = '<i class="fas ' + ikon + '"></i> ' + pesan;
        container.appendChild(toast);
        setTimeout(function() {
            toast.style.animation = 'slideInDown 0.3s ease reverse';
            setTimeout(function() {
                toast.remove();
            }, 300);
        }, 3500);
    }

    function toggleForm(tipe) {
        var formLogin = document.getElementById('loginForm');
        var formRegister = document.getElementById('registerForm');
        var formPengajuan = document.getElementById('pengajuanBukaAkunForm');
        if (formLogin) { formLogin.classList.add('hidden-form'); }
        if (formRegister) { formRegister.classList.add('hidden-form'); }
        if (formPengajuan) { formPengajuan.classList.add('hidden-form'); }
        if (tipe === 'register') {
            if (formRegister) { formRegister.classList.remove('hidden-form'); }
        } else if (tipe === 'pengajuan') {
            if (formPengajuan) { formPengajuan.classList.remove('hidden-form'); }
        } else {
            if (formLogin) { formLogin.classList.remove('hidden-form'); }
        }
    }

    function escapeHtml(text) {
        if (!text) {
            return '';
        }
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    // ===== AKHIR BLOK 5.1.1 =====

    // ===== BLOK 5.1.2 - Fungsi Ambil Lokasi =====
    function ambilLokasiRegister() {
        if (!navigator.geolocation) {
            tampilkanToast('Geolokasi tidak didukung.', 'error');
            return;
        }
        tampilkanToast('Mengambil lokasi...', 'info');
        navigator.geolocation.getCurrentPosition(function(pos) {
            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;
            document.getElementById('registerLat').value = lat;
            document.getElementById('registerLng').value = lng;
            fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng, {
                headers: { 'User-Agent': 'TokoOnline2R-App/1.0' }
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                document.getElementById('registerLokasi').value = data.display_name || 'Lokasi tidak diketahui';
                tampilkanToast('Lokasi berhasil diambil!', 'success');
                document.getElementById('btnDaftar').removeAttribute('disabled');
            })
            .catch(function() {
                document.getElementById('registerLokasi').value = 'Lat: ' + lat + ', Lng: ' + lng;
                tampilkanToast('Lokasi berhasil (tanpa alamat).', 'info');
                document.getElementById('btnDaftar').removeAttribute('disabled');
            });
        }, function(err) {
            tampilkanToast('Gagal mengambil lokasi: ' + err.message, 'error');
        });
    }

    function ambilLokasiPengajuan() {
        if (!navigator.geolocation) {
            tampilkanToast('Geolokasi tidak didukung.', 'error');
            return;
        }
        tampilkanToast('Mengambil lokasi...', 'info');
        navigator.geolocation.getCurrentPosition(function(pos) {
            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;
            document.getElementById('pengajuanLat').value = lat;
            document.getElementById('pengajuanLng').value = lng;
            fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng, {
                headers: { 'User-Agent': 'TokoOnline2R-App/1.0' }
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                document.getElementById('pengajuanLokasi').value = data.display_name || 'Lokasi tidak diketahui';
                tampilkanToast('Lokasi berhasil diambil!', 'success');
                document.getElementById('btnAjukan').removeAttribute('disabled');
            })
            .catch(function() {
                document.getElementById('pengajuanLokasi').value = 'Lat: ' + lat + ', Lng: ' + lng;
                tampilkanToast('Lokasi berhasil (tanpa alamat).', 'info');
                document.getElementById('btnAjukan').removeAttribute('disabled');
            });
        }, function(err) {
            tampilkanToast('Gagal mengambil lokasi: ' + err.message, 'error');
        });
    }
    // ===== AKHIR BLOK 5.1.2 =====

    // ===== BLOK 5.1.3 - Fungsi Lupa Password =====
    async function lupaPassword() {
        var username = document.getElementById('loginUsername').value.trim();
        if (!username) {
            tampilkanToast('Masukkan username anda terlebih dahulu!', 'warning');
            return;
        }
        if (username === 'admin') {
            tampilkanToast('SuperAdmin tidak bisa di-reset melalui form ini!', 'error');
            return;
        }
        var dataAkun = getDataAkun();
        var indexUser = -1;
        for (var indeks = 0; indeks < dataAkun.length; indeks++) {
            if (dataAkun[indeks].username === username) {
                indexUser = indeks;
                break;
            }
        }
        if (indexUser === -1) {
            tampilkanToast('Username tidak ditemukan!', 'error');
            return;
        }
        var newPassword = Math.random().toString(36).slice(-8);
        var hash = await hashPassword(newPassword);
        dataAkun[indexUser].password = hash;
        simpanDataAkun(dataAkun);
        tampilkanToast('Password baru anda: ' + newPassword, 'success');
    }
    // ===== AKHIR BLOK 5.1.3 =====

    // ===== BLOK 5.1.4 - Fungsi Simpan & Muat Gambar =====
    // Simpan gambar base64 ke data akun user yang sedang login
    function simpanGambarUser(field, base64) {
        var user = JSON.parse(localStorage.getItem('2r_user') || '{}');
        if (!user.username) return;
        var dataAkun = getDataAkun();
        for (var i = 0; i < dataAkun.length; i++) {
            if (dataAkun[i].username === user.username) {
                dataAkun[i][field] = base64;
                break;
            }
        }
        simpanDataAkun(dataAkun);
        // Update session
        user[field] = base64;
        localStorage.setItem('2r_user', JSON.stringify(user));
    }

    // Tampilkan gambar cover dan profil saat dashboard dimuat
    function muatGambarUser() {
        var user = JSON.parse(localStorage.getItem('2r_user') || '{}');
        var coverImg = document.getElementById('coverImage');
        var profileImg = document.getElementById('profileImage');
        if (user.coverPhoto) {
            coverImg.src = user.coverPhoto;
        } else {
            coverImg.src = ''; // atau placeholder
        }
        if (user.profilePhoto) {
            profileImg.src = user.profilePhoto;
        } else {
            profileImg.src = ''; // atau placeholder
        }
    }
    // ===== AKHIR BLOK 5.1.4 =====

    // ===== BLOK 5.1.5 - Event Listener Login, Register, Pengajuan, Upload =====
    document.addEventListener('DOMContentLoaded', function() {
        var dataAwalAkun = getDataAkun();
        var superAdminAda = false;
        for (var indeks = 0; indeks < dataAwalAkun.length; indeks++) {
            if (dataAwalAkun[indeks].role === 'superadmin') {
                superAdminAda = true;
                break;
            }
        }
        if (!superAdminAda) {
            (async function() {
                var hash = await hashPassword('admin123');
                var superAdminBaru = {
                    id: 'SA-001',
                    role: 'superadmin',
                    username: 'admin',
                    password: hash,
                    nama: 'SuperAdmin',
                    email: 'admin@2r.com',
                    nomorHp: '081234567890',
                    alamat: 'Kantor Pusat',
                    namaBank: 'BCA',
                    nomorRekening: '1234567890',
                    pemilikRekening: 'SuperAdmin',
                    status: 'AKTIF',
                    waktuRegistrasi: new Date().toISOString(),
                    coverPhoto: '',
                    profilePhoto: ''
                };
                dataAwalAkun.push(superAdminBaru);
                simpanDataAkun(dataAwalAkun);
                console.log('✅ SuperAdmin berhasil dibuat. Username: admin, Password: admin123');
            })();
        }

        // LOGIN
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var inputUsername = document.getElementById('loginUsername').value.trim();
            var inputPassword = document.getElementById('loginPassword').value.trim();
            var dataAkun = getDataAkun();
            var dataUser = null;
            for (var indeks = 0; indeks < dataAkun.length; indeks++) {
                if (dataAkun[indeks].username === inputUsername) {
                    dataUser = dataAkun[indeks];
                    break;
                }
            }
            if (dataUser === null) {
                tampilkanToast('Username atau password salah!', 'error');
                return;
            }
            var passwordCocok = await hashPassword(inputPassword) === dataUser.password;
            if (!passwordCocok) {
                tampilkanToast('Username atau password salah!', 'error');
                return;
            }
            if (dataUser.status !== 'AKTIF' && dataUser.role !== 'superadmin') {
                tampilkanToast('Akun belum aktif!', 'error');
                return;
            }
            localStorage.setItem('2r_user', JSON.stringify(dataUser));
            localStorage.setItem('2r_user_role', dataUser.role);
            tampilkanDasbor(dataUser);
        });

        // REGISTER
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var pilihRole = document.getElementById('registerRole').value;
            var inputUsername = document.getElementById('registerUsername').value.trim();
            var inputPassword = document.getElementById('registerPassword').value.trim();
            var inputNama = document.getElementById('registerNama').value.trim();
            var inputLat = document.getElementById('registerLat').value.trim();
            var inputLng = document.getElementById('registerLng').value.trim();
            if (!inputLat || !inputLng) {
                tampilkanToast('Anda wajib mengambil lokasi otomatis terlebih dahulu!', 'error');
                return;
            }
            if (!pilihRole || !inputUsername || !inputPassword || !inputNama) {
                tampilkanToast('Data belum lengkap!', 'warning');
                return;
            }
            var dataAkun = getDataAkun();
            var usernameExist = false;
            for (var indeks = 0; indeks < dataAkun.length; indeks++) {
                if (dataAkun[indeks].username === inputUsername) {
                    usernameExist = true;
                    break;
                }
            }
            if (usernameExist) {
                tampilkanToast('Username sudah dipakai!', 'error');
                return;
            }
            var statusAkun = (pilihRole === 'toko' || pilihRole === 'ojek') ? 'NONAKTIF (Menunggu Verifikasi)' : 'AKTIF';
            var hashPasswordBaru = await hashPassword(inputPassword);
            var akunBaru = {
                id: generateId(pilihRole),
                role: pilihRole,
                username: inputUsername,
                password: hashPasswordBaru,
                nama: inputNama,
                email: '',
                nomorHp: '',
                alamat: '',
                latitude: inputLat,
                longitude: inputLng,
                namaBank: '',
                nomorRekening: '',
                pemilikRekening: '',
                status: statusAkun,
                waktuRegistrasi: new Date().toISOString(),
                coverPhoto: '',
                profilePhoto: ''
            };
            dataAkun.push(akunBaru);
            simpanDataAkun(dataAkun);
            tampilkanToast('Akun berhasil dibuat! ID: ' + akunBaru.id, 'success');
            document.getElementById('registerForm').reset();
            document.getElementById('btnDaftar').setAttribute('disabled', 'disabled');
            toggleForm('login');
        });

        // PENGAJUAN
        document.getElementById('pengajuanBukaAkunForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var inputNama = document.getElementById('pengajuanNama').value.trim();
            var inputKontak = document.getElementById('pengajuanKontak').value.trim();
            var pilihRole = document.getElementById('pengajuanRole').value;
            var inputAlasan = document.getElementById('pengajuanAlasan').value.trim();
            var inputLat = document.getElementById('pengajuanLat').value.trim();
            var inputLng = document.getElementById('pengajuanLng').value.trim();
            if (!inputLat || !inputLng) {
                tampilkanToast('Anda wajib mengambil lokasi otomatis terlebih dahulu!', 'error');
                return;
            }
            if (!inputNama || !inputKontak || !pilihRole || !inputAlasan) {
                tampilkanToast('Lengkapi data anda!', 'warning');
                return;
            }
            var dataPengajuan = JSON.parse(localStorage.getItem('2r_pengajuan_buka_akun') || '[]');
            var pengajuanBaru = {
                id: 'PB-' + Date.now(),
                nama: inputNama,
                kontak: inputKontak,
                role: pilihRole,
                alasan: inputAlasan,
                latitude: inputLat,
                longitude: inputLng,
                alamatLokasi: document.getElementById('pengajuanLokasi').value.trim() || '',
                status: 'MENUNGGU',
                waktu: new Date().toISOString()
            };
            dataPengajuan.push(pengajuanBaru);
            localStorage.setItem('2r_pengajuan_buka_akun', JSON.stringify(dataPengajuan));
            document.getElementById('pengajuanBukaAkunForm').reset();
            document.getElementById('btnAjukan').setAttribute('disabled', 'disabled');
            tampilkanToast('Pengajuan anda telah dikirim ke Admin!', 'success');
            toggleForm('login');
        });

        // ===== UPLOAD COVER & PROFIL =====
        var coverContainer = document.getElementById('coverContainer');
        var uploadCover = document.getElementById('uploadCover');
        if (coverContainer) {
            coverContainer.addEventListener('click', function() {
                uploadCover.click();
            });
        }
        if (uploadCover) {
            uploadCover.addEventListener('change', function(e) {
                var file = e.target.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function(ev) {
                    var base64 = ev.target.result;
                    simpanGambarUser('coverPhoto', base64);
                    document.getElementById('coverImage').src = base64;
                    tampilkanToast('Cover berhasil diubah!', 'success');
                };
                reader.readAsDataURL(file);
            });
        }

        var profileWrapper = document.getElementById('profileWrapper');
        var uploadProfile = document.getElementById('uploadProfile');
        if (profileWrapper) {
            profileWrapper.addEventListener('click', function() {
                uploadProfile.click();
            });
        }
        if (uploadProfile) {
            uploadProfile.addEventListener('change', function(e) {
                var file = e.target.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function(ev) {
                    var base64 = ev.target.result;
                    simpanGambarUser('profilePhoto', base64);
                    document.getElementById('profileImage').src = base64;
                    tampilkanToast('Foto profil berhasil diubah!', 'success');
                };
                reader.readAsDataURL(file);
            });
        }

        // LOGOUT
        document.getElementById('buttonLogout').addEventListener('click', function() {
            if (confirm('Yakin keluar?')) {
                localStorage.removeItem('2r_user');
                localStorage.removeItem('2r_user_role');
                location.reload();
            }
        });

        // SIDEBAR TOGGLE
        var menuToggle = document.getElementById('menuToggle');
        var sidebar = document.querySelector('.sidebar-simple');
        var overlay = document.getElementById('sidebarOverlay');
        if (menuToggle && sidebar && overlay) {
            menuToggle.addEventListener('click', function(e) {
                e.preventDefault();
                if (sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                } else {
                    sidebar.classList.add('open');
                    overlay.classList.add('active');
                }
            });
            overlay.addEventListener('click', function() {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            });
        }
    });
    // ===== AKHIR BLOK 5.1.5 =====

    // ===== BLOK 5.1.6 - Fungsi Dashboard & Sidebar =====
    function tampilkanDasbor(user) {
        document.getElementById('pageAuthentication').style.display = 'none';
        document.getElementById('pageDashboard').style.display = 'block';
        document.getElementById('userNama').textContent = user.nama;
        document.getElementById('roleBadge').textContent = user.role || 'User';
        document.getElementById('displayJamSimple').textContent = new Date().toLocaleTimeString('id-ID') + ' | ' + new Date().toLocaleDateString('id-ID');

        setInterval(function() {
            var sekarang = new Date();
            var jamEl = document.getElementById('displayJamSimple');
            if (jamEl) {
                jamEl.textContent = sekarang.toLocaleTimeString('id-ID') + ' | ' + sekarang.toLocaleDateString('id-ID');
            }
        }, 1000);

        var sidebarHtml = `
            <div class="menu-item active" data-page="home"><i class="fas fa-home"></i> Beranda</div>
            <div class="menu-item" data-page="profile"><i class="fas fa-user-circle"></i> Profil</div>
            <div class="menu-item" data-page="katalog"><i class="fas fa-box"></i> Katalog</div>
            <div class="menu-item" data-page="logout" onclick="document.getElementById('buttonLogout').click();"><i class="fas fa-sign-out-alt"></i> Keluar</div>
        `;
        document.getElementById('sidebarContainer').innerHTML = sidebarHtml;

        var items = document.querySelectorAll('.sidebar-simple .menu-item');
        for (var indeks = 0; indeks < items.length; indeks++) {
            var item = items[indeks];
            item.onclick = function() {
                for (var j = 0; j < items.length; j++) {
                    items[j].classList.remove('active');
                }
                this.classList.add('active');
                var page = this.getAttribute('data-page');
                if (page === 'home') {
                    renderBerandaSederhana(user);
                } else if (page === 'profile') {
                    tampilkanToast('Fitur Profil sedang dibangun', 'info');
                } else if (page === 'katalog') {
                    tampilkanToast('Katalog sedang dibangun', 'info');
                }
                if (window.innerWidth <= 767) {
                    document.querySelector('.sidebar-simple').classList.remove('open');
                    document.getElementById('sidebarOverlay').classList.remove('active');
                }
            };
        }
        // Muat gambar cover & profil
        muatGambarUser();
        renderBerandaSederhana(user);
    }

    function renderBerandaSederhana(pengguna) {
        var areaKonten = document.getElementById('mainContent');
        if (!areaKonten) {
            return;
        }
        if (!pengguna) {
            pengguna = JSON.parse(localStorage.getItem('2r_user') || '{}');
        }

        var semuaAkun = getDataAkun();
        var jumlahToko = 0;
        var jumlahOjek = 0;
        var jumlahCustomer = 0;
        for (var indeks = 0; indeks < semuaAkun.length; indeks++) {
            var akun = semuaAkun[indeks];
            if (akun.role === 'toko' || akun.role === 'pedagang' || akun.role === 'codseller') {
                jumlahToko++;
            } else if (akun.role === 'ojek') {
                jumlahOjek++;
            } else if (akun.role === 'customer') {
                jumlahCustomer++;
            }
        }

        var html = `
            <div class="fb-card">
                <h3 style="margin-bottom:10px;">Selamat Datang, ${escapeHtml(pengguna.nama||pengguna.username||'User')}</h3>
                <p style="margin-bottom:10px; color:#888;">Role: ${escapeHtml(pengguna.role||'User')}</p>
                <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(100px,1fr)); gap:15px; margin-top:15px;">
                    <div style="text-align:center; padding:15px; background:#f8f9fa; border-radius:8px; border:1px solid #eee;">
                        <div style="font-size:24px; font-weight:700; color:var(--primary);">${jumlahToko}</div>
                        <div style="font-size:13px; color:#888;">Toko Terdaftar</div>
                    </div>
                    <div style="text-align:center; padding:15px; background:#f8f9fa; border-radius:8px; border:1px solid #eee;">
                        <div style="font-size:24px; font-weight:700; color:#2196F3;">${jumlahOjek}</div>
                        <div style="font-size:13px; color:#888;">Ojek Terdaftar</div>
                    </div>
                    <div style="text-align:center; padding:15px; background:#f8f9fa; border-radius:8px; border:1px solid #eee;">
                        <div style="font-size:24px; font-weight:700; color:#4CAF50;">${jumlahCustomer}</div>
                        <div style="font-size:13px; color:#888;">Customer Terdaftar</div>
                    </div>
                </div>
            </div>
        `;

        areaKonten.innerHTML = html;
    }
