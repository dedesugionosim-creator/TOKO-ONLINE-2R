<script>
    function getDataAkun() { var dataAkun = localStorage.getItem('2r_akun'); return dataAkun ? JSON.parse(dataAkun) : []; }
    function simpanDataAkun(akun) { localStorage.setItem('2r_akun', JSON.stringify(akun)); }
    async function hashPassword(password) {
        var encoder = new TextEncoder();
        var data = encoder.encode(password);
        var hashBuffer = await crypto.subtle.digest('SHA-256', data);
        var hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
    function generateId(role) {
        var dataAkun = getDataAkun();
        var daftar = dataAkun.filter(a => a.role === role);
        var nomor = 1;
        daftar.forEach(a => { var n = parseInt(a.id.split('-')[1]); if (n >= nomor) nomor = n+1; });
        var prefix = { customer:'CUST', toko:'TOKO', ojek:'OJEK', pedagang:'PEDAGANG', codseller:'COD' }[role] || 'USR';
        return prefix + '-' + String(nomor).padStart(3, '0');
    }
    function tampilkanToast(pesan, tipe) {
        if (!tipe) tipe = 'success';
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'toast ' + tipe;
        toast.innerHTML = '<i class="fas ' + ({success:'fa-check-circle', error:'fa-times-circle', warning:'fa-exclamation-triangle', info:'fa-info-circle'}[tipe]) + '"></i> ' + pesan;
        container.appendChild(toast);
        setTimeout(() => { toast.style.animation = 'slideInDown 0.3s ease reverse'; setTimeout(() => toast.remove(), 300); }, 3500);
    }
    function toggleForm(tipe) {
        ['loginForm','registerForm','pengajuanBukaAkunForm'].forEach(id => document.getElementById(id).classList.add('hidden-form'));
        if (tipe === 'register') document.getElementById('registerForm').classList.remove('hidden-form');
        else if (tipe === 'pengajuan') document.getElementById('pengajuanBukaAkunForm').classList.remove('hidden-form');
        else document.getElementById('loginForm').classList.remove('hidden-form');
    }
    function escapeHtml(text) { if (!text) return ''; var div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

    function ambilLokasiRegister() {
        if (!navigator.geolocation) { tampilkanToast('Geolokasi tidak didukung.', 'error'); return; }
        tampilkanToast('Mengambil lokasi...', 'info');
        navigator.geolocation.getCurrentPosition(pos => {
            var lat = pos.coords.latitude, lng = pos.coords.longitude;
            document.getElementById('registerLat').value = lat;
            document.getElementById('registerLng').value = lng;
            fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng, { headers:{'User-Agent':'TokoOnline2R-App/1.0'} })
                .then(r => r.json())
                .then(data => {
                    document.getElementById('registerLokasi').value = data.display_name || 'Lokasi tidak diketahui';
                    tampilkanToast('Lokasi berhasil diambil!', 'success');
                    document.getElementById('btnDaftar').removeAttribute('disabled');
                })
                .catch(() => {
                    document.getElementById('registerLokasi').value = 'Lat: '+lat+', Lng: '+lng;
                    tampilkanToast('Lokasi berhasil (tanpa alamat).', 'info');
                    document.getElementById('btnDaftar').removeAttribute('disabled');
                });
        }, err => tampilkanToast('Gagal mengambil lokasi: '+err.message, 'error'));
    }
    function ambilLokasiPengajuan() {
        if (!navigator.geolocation) { tampilkanToast('Geolokasi tidak didukung.', 'error'); return; }
        tampilkanToast('Mengambil lokasi...', 'info');
        navigator.geolocation.getCurrentPosition(pos => {
            var lat = pos.coords.latitude, lng = pos.coords.longitude;
            document.getElementById('pengajuanLat').value = lat;
            document.getElementById('pengajuanLng').value = lng;
            fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng, { headers:{'User-Agent':'TokoOnline2R-App/1.0'} })
                .then(r => r.json())
                .then(data => {
                    document.getElementById('pengajuanLokasi').value = data.display_name || 'Lokasi tidak diketahui';
                    tampilkanToast('Lokasi berhasil diambil!', 'success');
                    document.getElementById('btnAjukan').removeAttribute('disabled');
                })
                .catch(() => {
                    document.getElementById('pengajuanLokasi').value = 'Lat: '+lat+', Lng: '+lng;
                    tampilkanToast('Lokasi berhasil (tanpa alamat).', 'info');
                    document.getElementById('btnAjukan').removeAttribute('disabled');
                });
        }, err => tampilkanToast('Gagal mengambil lokasi: '+err.message, 'error'));
    }
    async function lupaPassword() {
        var username = document.getElementById('loginUsername').value.trim();
        if (!username) { tampilkanToast('Masukkan username dulu!', 'warning'); return; }
        if (username === 'admin') { tampilkanToast('SuperAdmin tidak bisa di-reset lewat sini!', 'error'); return; }
        var dataAkun = getDataAkun();
        var index = dataAkun.findIndex(a => a.username === username);
        if (index === -1) { tampilkanToast('Username tidak ditemukan!', 'error'); return; }
        var newPassword = Math.random().toString(36).slice(-8);
        dataAkun[index].password = await hashPassword(newPassword);
        simpanDataAkun(dataAkun);
        tampilkanToast('Password baru Anda: ' + newPassword, 'success');
    }

<!-- BLOK 5.3 - LOGIN, REGISTER, PENGAJUAN & SIDEBAR TOGGLE      -->
<!-- ============================================================ -->
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var username = document.getElementById('loginUsername').value.trim();
            var password = document.getElementById('loginPassword').value.trim();
            var dataAkun = getDataAkun();
            var user = dataAkun.find(a => a.username === username);
            if (!user) { tampilkanToast('Username atau password salah!', 'error'); return; }
            var cocok = await hashPassword(password) === user.password;
            if (!cocok) { tampilkanToast('Username atau password salah!', 'error'); return; }
            if (user.status !== 'AKTIF' && user.role !== 'superadmin') { tampilkanToast('Akun belum aktif!', 'error'); return; }
            localStorage.setItem('2r_user', JSON.stringify(user));
            localStorage.setItem('2r_user_role', user.role);
            tampilkanDasbor(user);
        });

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var role = document.getElementById('registerRole').value;
            var username = document.getElementById('registerUsername').value.trim();
            var password = document.getElementById('registerPassword').value.trim();
            var nama = document.getElementById('registerNama').value.trim();
            var lat = document.getElementById('registerLat').value.trim();
            var lng = document.getElementById('registerLng').value.trim();
            if (!lat || !lng) { tampilkanToast('Ambil lokasi dulu!', 'error'); return; }
            if (!role || !username || !password || !nama) { tampilkanToast('Data belum lengkap!', 'warning'); return; }
            var dataAkun = getDataAkun();
            if (dataAkun.find(a => a.username === username)) { tampilkanToast('Username sudah dipakai!', 'error'); return; }
            var status = (role === 'toko' || role === 'ojek') ? 'NONAKTIF (Menunggu Verifikasi)' : 'AKTIF';
            var akunBaru = { id: generateId(role), role, username, password: await hashPassword(password), nama, email:'', nomorHp:'', alamat:'', latitude:lat, longitude:lng, namaBank:'', nomorRekening:'', pemilikRekening:'', status, waktuRegistrasi: new Date().toISOString() };
            dataAkun.push(akunBaru);
            simpanDataAkun(dataAkun);
            tampilkanToast('Akun berhasil! ID: '+akunBaru.id, 'success');
            document.getElementById('registerForm').reset();
            document.getElementById('btnDaftar').setAttribute('disabled', 'disabled');
            toggleForm('login');
        });

        document.getElementById('pengajuanBukaAkunForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var nama = document.getElementById('pengajuanNama').value.trim();
            var kontak = document.getElementById('pengajuanKontak').value.trim();
            var role = document.getElementById('pengajuanRole').value;
            var alasan = document.getElementById('pengajuanAlasan').value.trim();
            var lat = document.getElementById('pengajuanLat').value.trim();
            var lng = document.getElementById('pengajuanLng').value.trim();
            if (!lat || !lng) { tampilkanToast('Ambil lokasi dulu!', 'error'); return; }
            if (!nama || !kontak || !role || !alasan) { tampilkanToast('Lengkapi data!', 'warning'); return; }
            var data = JSON.parse(localStorage.getItem('2r_pengajuan_buka_akun') || '[]');
            data.push({ id:'PB-'+Date.now(), nama, kontak, role, alasan, latitude:lat, longitude:lng, alamatLokasi: document.getElementById('pengajuanLokasi').value.trim()||'', status:'MENUNGGU', waktu:new Date().toISOString() });
            localStorage.setItem('2r_pengajuan_buka_akun', JSON.stringify(data));
            document.getElementById('pengajuanBukaAkunForm').reset();
            document.getElementById('btnAjukan').setAttribute('disabled', 'disabled');
            tampilkanToast('Pengajuan terkirim ke Admin!', 'success');
            toggleForm('login');
        });

        document.getElementById('buttonLogout').addEventListener('click', function() {
            if (confirm('Yakin keluar?')) { localStorage.removeItem('2r_user'); localStorage.removeItem('2r_user_role'); location.reload(); }
        });

        var menuToggle = document.getElementById('menuToggle');
        var sidebar = document.querySelector('.sidebar-fb-left');
        var overlay = document.getElementById('sidebarOverlay');
        if (menuToggle && sidebar && overlay) {
            menuToggle.addEventListener('click', function(e) {
                e.preventDefault();
                if (sidebar.classList.contains('open')) { sidebar.classList.remove('open'); overlay.classList.remove('active'); }
                else { sidebar.classList.add('open'); overlay.classList.add('active'); }
            });
            overlay.addEventListener('click', function() { sidebar.classList.remove('open'); overlay.classList.remove('active'); });
        }

        var dataAkun = getDataAkun();
        if (!dataAkun.find(a => a.role === 'superadmin')) {
            (async function() {
                var hash = await hashPassword('admin123');
                dataAkun.push({ id:'SA-001', role:'superadmin', username:'admin', password:hash, nama:'SuperAdmin', email:'admin@2r.com', nomorHp:'081234567890', alamat:'Kantor Pusat', namaBank:'BCA', nomorRekening:'1234567890', pemilikRekening:'SuperAdmin', status:'AKTIF', waktuRegistrasi: new Date().toISOString() });
                simpanDataAkun(dataAkun);
                console.log('SuperAdmin: admin / admin123');
            })();
        }
    });

<!-- BLOK 5.4 - TAMPILKAN DASHBOARD & RENDER FEED (TIMELINE)     -->
<!-- ============================================================ -->
    function tampilkanDasbor(user) {
        document.getElementById('pageAuthentication').style.display = 'none';
        document.getElementById('pageDashboard').style.display = 'block';
        document.getElementById('userNama').textContent = user.nama;
        document.getElementById('roleBadge').textContent = user.role || 'User';
        document.getElementById('displayJamFB').textContent = new Date().toLocaleTimeString('id-ID') + ' | ' + new Date().toLocaleDateString('id-ID');

        setInterval(() => {
            var now = new Date();
            var jamEl = document.getElementById('displayJamFB');
            if (jamEl) jamEl.textContent = now.toLocaleTimeString('id-ID') + ' | ' + now.toLocaleDateString('id-ID');
        }, 1000);

        var sidebarHtml = `
            <div class="menu-item active" data-page="home"><i class="fas fa-home"></i> Beranda</div>
            <div class="menu-item" data-page="profile"><i class="fas fa-user-circle"></i> Profil</div>
            <div class="menu-item" data-page="katalog"><i class="fas fa-box"></i> Katalog</div>
            <div class="menu-item" data-page="toko"><i class="fas fa-store"></i> Toko</div>
            <div class="menu-item" data-page="ojek"><i class="fas fa-motorcycle"></i> Ojek</div>
            <div class="menu-item" data-page="logout" onclick="document.getElementById('buttonLogout').click();"><i class="fas fa-sign-out-alt"></i> Keluar</div>
        `;
        document.getElementById('sidebarContainer').innerHTML = sidebarHtml;

        var items = document.querySelectorAll('.sidebar-fb-left .menu-item');
        items.forEach(function(item) {
            item.onclick = function() {
                items.forEach(m => m.classList.remove('active'));
                this.classList.add('active');
                var page = this.getAttribute('data-page');
                if (page === 'home') renderFeedBeranda(user);
                else if (page === 'profile') tampilkanToast('Fitur Profil sedang dibangun', 'info');
                else if (page === 'katalog') tampilkanToast('Katalog sedang dibangun', 'info');
                else if (page === 'toko') tampilkanToast('Fitur Toko sedang dibangun', 'info');
                else if (page === 'ojek') tampilkanToast('Fitur Ojek sedang dibangun', 'info');
                if (window.innerWidth <= 767) { document.querySelector('.sidebar-fb-left').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('active'); }
            };
        });
        renderFeedBeranda(user);
    }

    function renderFeedBeranda(pengguna) {
        var areaKonten = document.getElementById('mainContent');
        if (!areaKonten) return;
        if (!pengguna) pengguna = JSON.parse(localStorage.getItem('2r_user') || '{}');

        var semuaAkun = getDataAkun();
        var jmlToko = semuaAkun.filter(a => a.role==='toko'||a.role==='pedagang'||a.role==='codseller').length;
        var jmlOjek = semuaAkun.filter(a => a.role==='ojek').length;
        var jmlCustomer = semuaAkun.filter(a => a.role==='customer').length;

        var html = `
            <!-- PROFIL PENGGUNA -->
            <div class="fb-card" style="display:flex; align-items:center; gap:15px; padding:15px;">
                <div style="width:60px; height:60px; border-radius:50%; background:#f0f0f0; display:flex; justify-content:center; align-items:center; color:#aaa; font-size:30px; overflow:hidden; border:2px solid #fff; box-shadow:var(--shadow);">
                    <img id="fotoProfilFeed" src="" style="width:100%; height:100%; object-fit:cover; display:none;">
                    <i id="fotoProfilFeedPlaceholder" class="fas fa-user-circle" style="font-size:50px; color:#ccc;"></i>
                </div>
                <div>
                    <h2 style="margin:0; font-size:20px; font-weight:700;">${escapeHtml(pengguna.nama||pengguna.username||'User')}</h2>
                    <p style="margin:0; font-size:13px; color:#888;">${escapeHtml(pengguna.role||'User')}</p>
                </div>
            </div>

            <!-- POSTINGAN STATUS -->
            <div class="fb-card">
                <div style="font-weight:600; margin-bottom:5px;">Apa yang sedang Anda pikirkan?</div>
                <div style="background:#f0f2f5; border-radius:20px; padding:10px 15px; color:#888; cursor:pointer;" onclick="tampilkanToast('Fitur Buat Status belum siap', 'info')">Tulis status Anda...</div>
            </div>

            <!-- STATISTIK & PRODUK UNGGULAN -->
            <div class="fb-card">
                <div class="fb-card-header">Statistik Terkini</div>
                <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(100px,1fr)); gap:10px;">
                    <div style="text-align:center; padding:10px; background:#f8f9fa; border-radius:8px;"><div style="font-size:20px; font-weight:700; color:var(--primary);">${jmlToko}</div><div style="font-size:12px; color:#888;">Toko</div></div>
                    <div style="text-align:center; padding:10px; background:#f8f9fa; border-radius:8px;"><div style="font-size:20px; font-weight:700; color:#2196F3;">${jmlOjek}</div><div style="font-size:12px; color:#888;">Ojek</div></div>
                    <div style="text-align:center; padding:10px; background:#f8f9fa; border-radius:8px;"><div style="font-size:20px; font-weight:700; color:#4CAF50;">${jmlCustomer}</div><div style="font-size:12px; color:#888;">Pelanggan</div></div>
                </div>
            </div>
        `;

        areaKonten.innerHTML = html;

        var avatar = localStorage.getItem('2r_user_avatar_' + pengguna.id);
        if (avatar) {
            document.getElementById('fotoProfilFeed').src = avatar;
            document.getElementById('fotoProfilFeed').style.display = 'block';
            document.getElementById('fotoProfilFeedPlaceholder').style.display = 'none';
        }
    }
